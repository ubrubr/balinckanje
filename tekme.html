<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f56a5d"><title>Balinčkanje — Izločilni turnir</title>
<link rel="stylesheet" href="./display-style.css">
<style>
#stage{background:linear-gradient(165deg,#ff9282,#f86b64 47%,#e74e54)}
#stage:before{z-index:0;opacity:.34;transform:rotate(-22deg)}
header{height:280px;position:relative;z-index:3;padding-top:118px}header h1{font-style:italic;font-size:96px;letter-spacing:-4px;margin-top:6px}
header .mini{font-size:21px;letter-spacing:3px}
.panel{position:absolute;inset:278px 22px 80px;z-index:2}
.legend{display:flex;justify-content:space-between;align-items:center;padding:14px 30px;background:#fffefde8;border-radius:18px;font-size:23px;font-weight:900;color:#3a3b63;margin:0 22px}
.diagram{position:relative;height:1300px;margin-top:18px;overflow:hidden}
.lane{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.lane path{fill:none;stroke:#fff8;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
.circle-wrap{position:absolute;width:280px;text-align:center;transform:translate(-50%,-50%);z-index:2}
.circle{position:relative;width:222px;height:222px;border-radius:50%;margin:auto;display:flex;justify-content:center;align-items:center;box-shadow:0 14px 22px #6e18374a,inset 0 0 0 12px #ffffff25;border:5px solid #ffffff77;color:#0b0b13}
.circle:before,.circle:after{content:"";position:absolute;inset:27px;border-radius:50%;border:7px solid #ffffff2d;pointer-events:none}
.circle:after{inset:55px;border-width:5px}
.circle.red{background:radial-gradient(circle at 37% 29%,#ffb2aa,#f45865 65%,#d62c55)}
.circle.yellow{background:radial-gradient(circle at 37% 29%,#fffcc1,#ffe25f 65%,#eac039)}
.circle.green{background:radial-gradient(circle at 37% 29%,#b4ffd0,#56d68f 65%,#26ad70)}
.circle.blue{background:radial-gradient(circle at 37% 29%,#9eeaf9,#16b3e8 65%,#1284cd)}
.circle.white{background:#fff;border:5px solid #676c73;box-shadow:0 12px 20px #8a273c34}
.circle .numbers{position:relative;z-index:2;font-size:76px;font-weight:1000;letter-spacing:-5px;white-space:nowrap}
.circle .numbers small{font-size:35px;color:#153dd5;letter-spacing:-2px;padding:0 4px}
.circle .score{position:relative;z-index:2;font-size:80px;font-weight:1000;letter-spacing:-6px;white-space:nowrap;color:#0b0b13}
.circle .score small{font-size:34px;color:#153dd5;letter-spacing:-3px;margin:0 5px}
.circle .score.pending{color:#222}
.circle .champion{position:absolute;top:-60px;right:-20px;font-size:70px;transform:rotate(17deg);filter:drop-shadow(0 3px 4px #5d372a7a)}
.round-label{font-size:21px;color:#fff;font-weight:1000;letter-spacing:.5px;text-shadow:0 2px 6px #983b50;margin-top:12px}
.team-labels{margin:6px auto 0;width:280px;font-size:17px;line-height:1.22;font-weight:900;color:#1e1d4d;text-shadow:0 1px 0 #ffffff7c;background:#fffefbe8;padding:8px 6px;border-radius:11px;min-height:57px}
.q1{left:151px;top:190px}.q2{left:151px;top:490px}.q3{left:151px;top:790px}.q4{left:151px;top:1090px}
.s1{left:525px;top:340px}.s2{left:525px;top:940px}.f1{left:876px;top:640px}
.phase{font-size:25px;font-weight:900;color:#fff;text-shadow:0 2px 8px #8a314b;letter-spacing:1px}
#bronze{background:#fffbeee8;border-radius:20px;padding:17px 26px;margin:0 27px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:23px;font-weight:900;min-height:112px}
#bronze .bronze-match{flex:1;color:#24234c;font-size:21px;text-align:center;line-height:1.4}
#bronze .bronze-result{font-size:42px;color:#1226bc}
#bronze .bronze-title{font-size:20px;color:#b56a26}
.podium{display:flex;align-items:flex-end;height:930px;gap:16px;justify-content:center;padding:85px 12px 0}
.podium-col{width:32%;text-align:center}
.podium-names{min-height:115px;font-weight:900;font-size:34px;line-height:1.22;display:flex;align-items:end;justify-content:center}
.podium-rank{display:flex;justify-content:center;align-items:flex-start;padding-top:70px;border-radius:18px 18px 0 0;color:#181c39;font-size:110px;font-weight:1000}
.podium-rank.one{height:520px;background:linear-gradient(#fff4a2,#ddb02b)}
.podium-rank.two{height:380px;background:linear-gradient(#eaf3ff,#99aabe)}
.podium-rank.three{height:270px;background:linear-gradient(#f6d3a0,#ba8144)}
.waiting{background:#fffdf0;padding:32px;font-weight:800;font-size:33px;text-align:center;border-radius:25px;margin:75px 30px}
footer{z-index:5}
</style></head><body>
<div id="viewport"><main id="stage"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
<header><div class="mini">TURNIR V BALINČKANJU</div><h1 id="page-title">TURNIR</h1></header>
<div class="panel" id="panel"><div class="legend"><span>ČETRTFINALE</span><span>POLFINALE</span><span>FINALE</span></div>
<div class="diagram">
<svg class="lane" viewBox="0 0 1050 1300" preserveAspectRatio="none" aria-hidden="true">
<path d="M267 190 H337 V340 H413 M267 490 H337 V340 M267 790 H337 V940 H413 M267 1090 H337 V940 M637 340 H701 V640 H750 M637 940 H701 V640"/>
</svg><div id="bracket"></div></div>
<div id="bronze"><span class="bronze-title">3. MESTO</span><span class="bronze-match" id="bronze-teams">ZMAGOVALCA POLFINALOV NAPREDUJETA V FINALE</span><span class="bronze-result" id="bronze-score">— : —</span></div></div>
<footer><span>8 EKIP · 7 TEKEM DO PRVAKA</span><span id="foot-status">IZLOČILNI SISTEM</span></footer></main></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./shared.js"></script>
<script>(function(){
'use strict';var B=window.Balinckanje,latest=null;
function fit(){var scale=Math.min(innerWidth/1080,innerHeight/1920),st=document.getElementById('stage');st.style.transform='scale('+scale+')';st.style.left=((innerWidth-1080*scale)/2+(1080*scale-1080)/2)+'px';st.style.top=((innerHeight-1920*scale)/2+(1920*scale-1920)/2)+'px';}
addEventListener('resize',fit);fit();
var p={QF1:'q1',QF2:'q2',QF3:'q3',QF4:'q4',SF1:'s1',SF2:'s2',FINAL:'f1'};
var cs={QF1:'yellow',QF2:'green',QF3:'red',QF4:'blue',SF1:'white',SF2:'white',FINAL:'white'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]});}
function name(d,n){if(!n)return 'ČAKA NA ZMAGOVALCA';var t=B.teams(d,16)[n-1];return t&&t.players.length?t.players.map(function(x){return x.name}).join(' + '):'Ekipa '+n;}
function cell(d,m){var r=B.resultFor(d,m.id),quarter=m.stage==='cetrtfinale';
var label=(quarter?'':m.stage==='polfinale'?'POLFINALE': 'VELIKI FINALE');
var score=r?'<span class="score">'+r.home+'<small>vs</small>'+r.away+'</span>':quarter?'<span class="numbers">'+m.home+'<small>vs</small>'+m.away+'</span>':'<span class="score pending">0<small>vs</small>0</span>';
var who=m.home&&m.away?'<div class="team-labels">'+esc(name(d,m.home))+'<br>'+esc(name(d,m.away))+'</div>':'<div class="team-labels">ČAKA NA TEKMI</div>';
var crown=m.id==='FINAL'&&r?'<span class="champion">♛</span>':'';
return '<div class="circle-wrap '+p[m.id]+'"><div class="circle '+cs[m.id]+'">'+score+crown+'</div><div class="round-label">'+label+'</div>'+who+'</div>';
}
function podium(d){var w=B.podium(d);if(!w.gold||!w.silver)return '<div class="waiting">STOPNIČKE BODO ZNANE PO KONČANEM FINALU.</div>';
var teams=[{n:w.silver,rank:2,css:'two'},{n:w.gold,rank:1,css:'one'},{n:w.bronze,rank:3,css:'three'}];
return '<div class="podium">'+teams.map(function(t){return '<div class="podium-col"><div class="podium-names">'+esc(t.n?name(d,t.n):'ŠE NI ODLOČENO')+'</div><div class="podium-rank '+t.css+'">'+t.rank+'</div></div>';}).join('')+'</div>';
}
function render(d){var view=new URLSearchParams(location.search).get('pogled')||d.roundView||'turnir';if(['1','2','3','lestvica','turnir','cetrtfinale','polfinale','finale'].indexOf(view)<0&&view!=='stopnicke')view='turnir';
var f=B.bracketFixtures(d),title='TURNIR',root=document.getElementById('panel');root.innerHTML='';
if(view==='stopnicke'){title='STOPNIČKE';root.innerHTML=podium(d);}else{
title=view==='cetrtfinale'?'ČETRTFINALE':view==='polfinale'?'POLFINALE':view==='finale'?'FINALE':'TURNIR';
root.innerHTML='<div class="legend"><span>ČETRTFINALE</span><span>POLFINALE</span><span>FINALE</span></div><div class="diagram"><svg class="lane" viewBox="0 0 1050 1300" preserveAspectRatio="none"><path d="M267 190 H337 V340 H413 M267 490 H337 V340 M267 790 H337 V940 H413 M267 1090 H337 V940 M637 340 H701 V640 H750 M637 940 H701 V640"/></svg><div id="bracket"></div></div><div id="bronze"><span class="bronze-title">3. MESTO</span><span class="bronze-match" id="bronze-teams"></span><span class="bronze-result" id="bronze-score"></span></div>';
document.getElementById('bracket').innerHTML=f.slice(0,7).map(function(m){return cell(d,m);}).join('');
var m=f[7],r=B.resultFor(d,'THIRD');
document.getElementById('bronze-teams').textContent=m.ready?'EKIPA '+m.home+' vs EKIPA '+m.away:'PORAŽENCA POLFINALOV';
document.getElementById('bronze-score').textContent=r?r.home+' : '+r.away:'— : —';
}
document.getElementById('page-title').textContent=title;
document.getElementById('foot-status').textContent=B.finishedCount(d)+' / 7';
}
B.watch(function(row){latest=row.data;render(latest);});
})();</script></body></html>

<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Balinčkanje — Tekme</title>
<link rel="stylesheet" href="./display-style.css"><style>
.white-panel{min-height:1490px}.match-list{display:flex;flex-direction:column;gap:24px;margin-top:35px}.match{padding:30px 28px;border-radius:24px;background:#f4f6fc;border:2px solid #e5e7f1;min-height:270px;display:flex;flex-direction:column;gap:17px}.match-head{display:flex;justify-content:space-between;color:#727891;font-size:24px;font-weight:900;letter-spacing:1px}
.match-body{display:flex;align-items:stretch;gap:18px}.side{flex:1;min-width:0;text-align:center}.side h3{font-size:35px;letter-spacing:-1px;margin:0 0 14px;color:#172153}.side .names{font-size:27px;font-weight:750;line-height:1.15;min-height:55px;word-break:break-word}
.score{font-size:66px;line-height:1.18;font-weight:900;min-width:180px;white-space:nowrap;text-align:center;color:#1435d0;align-self:center}.pending{color:#bdc0ce}
.standings{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px}.group{padding:24px;background:#f3f5fb;border-radius:20px}.group h2{font-size:35px;margin:0 0 19px;color:var(--blue)}.group-row{display:grid;grid-template-columns:64px 1fr 50px 60px;align-items:center;gap:9px;font-size:25px;border-bottom:1px solid #d8dce9;padding:18px 2px;font-weight:700}.group-row:first-of-type{color:#126a45}.group-row:nth-of-type(2){color:#126a45}.group .hint{font-size:18px;color:#70768e;margin-top:19px}
.podium{height:1110px;display:flex;align-items:flex-end;justify-content:center;gap:17px;padding-bottom:70px}.podium-card{width:30%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.podium-card h3{font-size:32px;text-align:center;margin:0 0 25px}.podium-card p{text-align:center;font-weight:800;font-size:28px;line-height:1.3;min-height:77px}.block{width:100%;border-radius:24px 24px 0 0;font-weight:900;font-size:105px;display:flex;align-items:center;justify-content:center;color:#182046}.gold{height:620px;background:linear-gradient(#ffe994,#e7ae27)}.silver{height:430px;background:linear-gradient(#e9eff9,#9eacbf)}.bronze{height:300px;background:linear-gradient(#efc8a5,#c77e41)}
#foot-status{font-size:22px}
</style></head><body><div id="viewport"><main id="stage"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
<header><div class="mini">TURNIR V BALINČKANJU</div><h1 id="title">RAZPORED TEKEM</h1></header>
<section class="white-panel"><div id="intro" class="status-line">SAMODEJNE POSODOBITVE IZ SUPABASE</div><div id="content"></div></section>
<footer><span>8 EKIP · 2 SKUPINI</span><span id="foot-status">TEKME</span></footer></main></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./shared.js"></script>
<script>(function(){
  function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920),el=document.getElementById('stage');el.style.transform='scale('+s+')';el.style.left=((innerWidth-1080*s)/2+(1080*s-1080)/2)+'px';el.style.top=((innerHeight-1920*s)/2+(1920*s-1920)/2)+'px';}addEventListener('resize',fit);fit();
  var B=window.Balinckanje,latest=null, fixed=new URLSearchParams(location.search).get('pogled');
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function teamName(data,n){if(!n)return '—';var members=B.teams(data,16)[n-1].players.map(function(p){return p.name;});return members.length?members.join(' / '):'Ekipa '+n;}
  function matchMarkup(data,m){var r=B.resultFor(data,m.id);
    return '<div class="match"><div class="match-head"><span>'+escapeHtml(m.group?'SKUPINA '+m.group:'ZAKLJUČNI DEL')+'</span><span>'+escapeHtml(m.id)+'</span></div><div class="match-body">'+
    '<div class="side"><h3>EKIPA '+(m.home||'—')+'</h3><div class="names">'+escapeHtml(teamName(data,m.home))+'</div></div>'+
    '<div class="score '+(r?'':'pending')+'">'+(r?r.home+' : '+r.away:'— : —')+'</div>'+
    '<div class="side"><h3>EKIPA '+(m.away||'—')+'</h3><div class="names">'+escapeHtml(teamName(data,m.away))+'</div></div></div></div>';
  }
  function standingsMarkup(data){return '<div class="standings">'+['A','B'].map(function(g){return '<div class="group"><h2>SKUPINA '+g+'</h2><div class="group-row" style="font-size:19px;color:#747a8b"><span>EK.</span><span>IGRE</span><span>Z</span><span>+/-</span></div>'+B.standings(data,g).map(function(t){return '<div class="group-row"><span>'+t.number+'</span><span>'+t.played+'/3</span><span>'+t.wins+'</span><span>'+t.gd+'</span></div>';}).join('')+'<div class="hint">Prvi dve ekipi napredujeta v polfinale.</div></div>';}).join('')+'</div><div class="status-line">Pri popolnem izenačenju je potrebno potrditi vrstni red ekip.</div>';}
  function podiumMarkup(data){var f=B.knockoutFixtures(data),final=f[3],third=f[2],r=B.resultFor(data,'FINAL'),r3=B.resultFor(data,'THIRD');
    if(!r||!r3||!final.home||!third.home)return '<div class="big-error">Stopničke bodo na voljo po končanem finalu in tekmi za 3. mesto.</div>';
    var win=r.home>r.away?final.home:final.away,second=r.home>r.away?final.away:final.home,bronze=r3.home>r3.away?third.home:third.away;
    function step(n,css,pos){return '<div class="podium-card"><h3>'+pos+'. MESTO</h3><p>'+escapeHtml(teamName(data,n))+'</p><div class="block '+css+'">'+pos+'</div></div>';}
    return '<div class="podium">'+step(second,'silver',2)+step(win,'gold',1)+step(bronze,'bronze',3)+'</div>';
  }
  function render(data){var view=fixed||data.roundView||'1',list=B.groupSchedule(data),title='';var html='';
    if(['1','2','3'].indexOf(view)>=0){title=view+'. KROG';html='<div class="match-list">'+list.filter(function(m){return String(m.round)===view;}).map(function(m){return matchMarkup(data,m);}).join('')+'</div>';}
    else if(view==='polfinale'){title='POLFINALE';html='<div class="match-list">'+B.knockoutFixtures(data).slice(0,2).map(function(m){return matchMarkup(data,m);}).join('')+'</div>';}
    else if(view==='finale'){title='FINALE';html='<div class="match-list">'+B.knockoutFixtures(data).slice(2).map(function(m){return matchMarkup(data,m);}).join('')+'</div>';}
    else if(view==='stopnicke'){title='STOPNIČKE';html=podiumMarkup(data);}
    else {title='LESTVICA';html=standingsMarkup(data);}
    document.getElementById('title').textContent=title;document.getElementById('content').innerHTML=html;document.getElementById('foot-status').textContent=title;
    document.getElementById('intro').textContent='REZULTATI SE POSODABLJAJO SAMODEJNO';
  }
  B.watch(function(row){latest=row.data;render(latest);});
})();</script></body></html>
